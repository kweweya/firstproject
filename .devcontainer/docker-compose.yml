services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3-3.14-trixie
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=python_web_dev
    volumes:
      - postgres-data:/var/lib/postgresql # Named volume for persisting PostgreSQL data
    ports:
      - 5435:5432

volumes:
  postgres-data: # Define a named volume for PostgreSQL data persistence

